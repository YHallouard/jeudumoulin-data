config:
  strategy: alphazero
  init:
    strategy: local
    model_path: models/alphazero/
    device: cpu
  training:
    iterations: 100
    episodes: 10
    simulations: 3000
    max_episode_steps: 300
    epochs: 30
    replay_buffer_size: 20000
    batch_size: 64
    learning_rate: 0.0003
    lr_scheduler_config:
      model_type: cosine_warm_rest_lr
      T_0: 10
      T_mult: 1
      min_lr: 5e-5
      last_epoch: -1
    temperature: 1.0
    save_frequency: 10
    eval_frequency: 10
    save_folder: models/alphazero
    verbose: true

